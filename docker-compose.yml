version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: prompt-library-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: prompts_user
      POSTGRES_PASSWORD: prompts_pass
      POSTGRES_DB: prompts_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: